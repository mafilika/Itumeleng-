<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construction Company</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24b;--dark:#0e0e10;--ivory:#f6f1e7}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--ivory);font:300 16px/1.8 Montserrat,Arial,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:1.1}
a{color:inherit;text-decoration:none}
#load{position:fixed;inset:0;background:var(--dark);z-index:99;display:grid;place-items:center;transition:opacity .8s,visibility .8s}
#load i{width:60px;height:2px;background:var(--gold);animation:ld 1.2s infinite}
@keyframes ld{0%{transform:scaleX(0)}50%{transform:scaleX(1)}100%{transform:scaleX(0)}}
nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;z-index:50;transition:.4s}
nav.s{background:rgba(14,14,16,.9);backdrop-filter:blur(12px);padding:12px 6%;border-bottom:1px solid #c9a24b44}
.logo{font:700 24px 'Cormorant Garamond',serif;letter-spacing:2px;display:flex;align-items:center;gap:10px}
.logo img{height:42px}.logo b{width:14px;height:14px;background:var(--gold);transform:rotate(45deg)}
nav ul{display:flex;gap:34px;list-style:none;font-size:12px;letter-spacing:3px;text-transform:uppercase}
nav ul a:hover{color:var(--gold)}
#bg{display:none;background:none;border:0;color:var(--gold);font-size:28px}
.hero{min-height:100vh;position:relative;display:grid;place-items:center;text-align:center;padding:120px 8% 80px;overflow:hidden}
.hbg{position:absolute;inset:-10% 0;background:linear-gradient(120deg,#0e0e10,#2a2112,#0e0e10,#3a2d14);background-size:300% 300%;background-position:center;animation:sh 14s ease infinite}
.hbg.im{animation:none;background-size:cover}
@keyframes sh{50%{background-position:100% 50%}}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#0e0e1066,#0e0e10ee)}
.hero>div{position:relative;z-index:2;max-width:900px}
.eb{color:var(--gold);letter-spacing:6px;text-transform:uppercase;font-size:12px;margin-bottom:24px}
.hero h1{font-size:clamp(42px,8vw,94px)}.hero p{margin:28px auto 40px;max-width:600px;opacity:.8}
.btn{display:inline-block;padding:16px 42px;border:1px solid var(--gold);color:var(--gold);letter-spacing:3px;font-size:12px;text-transform:uppercase;position:relative;overflow:hidden;transition:.4s;background:none;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--gold);color:var(--dark);box-shadow:0 0 30px #c9a24b66}
.sq{position:absolute;border:1px solid #c9a24b55;animation:fl 9s ease-in-out infinite;z-index:1}
@keyframes fl{50%{transform:translateY(-40px) rotate(45deg)}}
section{padding:120px 8%}
.hd{text-align:center;margin-bottom:70px}.hd h2{font-size:clamp(34px,5vw,60px)}
.hd:after{content:"";display:block;width:70px;height:2px;background:var(--gold);margin:22px auto}
.hd p{opacity:.7;max-width:560px;margin:auto}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.ab h2{font-size:clamp(34px,5vw,60px);margin-bottom:24px}
.ib{aspect-ratio:4/5;background:linear-gradient(135deg,#1c1c20,#2a2112);position:relative;overflow:hidden;border:1px solid #c9a24b55}
.ib:before{content:"";position:absolute;inset:14px;border:1px solid #c9a24b44;z-index:2;pointer-events:none}
.ib img{width:100%;height:100%;object-fit:cover;transition:transform 1s}
.ph{height:100%;display:grid;place-items:center;color:#c9a24b99;letter-spacing:3px;font-size:11px;text-transform:uppercase}
.stats{background:#16161a;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));text-align:center;gap:30px;border-block:1px solid #c9a24b33}
.stats b{display:block;font:700 62px 'Cormorant Garamond',serif;color:var(--gold)}
.stats span{font-size:12px;letter-spacing:3px;text-transform:uppercase}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;background:#c9a24b33}
.sv div{background:var(--dark);padding:50px 36px;transition:.5s;position:relative}
.sv div:hover{background:#1b170e;transform:translateY(-6px)}
.sv em{font:normal 700 46px 'Cormorant Garamond',serif;color:#c9a24b66}
.sv h3{font-size:28px;margin:10px 0}.sv p{opacity:.7;font-size:14px}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.gl .ib{aspect-ratio:4/3;cursor:pointer}.gl .ib:hover img{transform:scale(1.1)}
.gl figcaption{position:absolute;bottom:0;left:0;right:0;padding:24px;background:linear-gradient(transparent,#0e0e10ee);z-index:3;transform:translateY(100%);transition:.5s;font:700 22px 'Cormorant Garamond',serif}
.gl .ib:hover figcaption{transform:none}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.ct h2{font-size:clamp(34px,5vw,60px);margin-bottom:20px}.ct li{list-style:none;margin:14px 0;opacity:.85}.ct li b{color:var(--gold);display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase}
form{display:grid;gap:18px}
input,textarea{background:none;border:0;border-bottom:1px solid #c9a24b66;color:var(--ivory);padding:14px 0;font:inherit;outline:0;transition:.3s}
input:focus,textarea:focus{border-color:var(--gold)}
footer{text-align:center;padding:70px 8% 40px;border-top:1px solid #c9a24b33;background:#0a0a0c}
footer p{opacity:.6;max-width:500px;margin:18px auto;font-size:14px}footer small{opacity:.4}
.wa{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:10px;background:#25d366;color:#fff;padding:14px 20px;border-radius:50px;font:600 13px Montserrat,Arial,sans-serif;letter-spacing:1px;box-shadow:0 8px 30px #25d36666;animation:pu 2.4s infinite;transition:.3s}
.wa:hover{transform:translateY(-4px) scale(1.04)}.wa svg{width:26px;height:26px;fill:#fff}
@keyframes pu{0%{box-shadow:0 0 0 0 #25d366aa}70%{box-shadow:0 0 0 18px #25d36600}100%{box-shadow:0 0 0 0 #25d36600}}
@media(max-width:600px){.wa span{display:none}.wa{padding:14px}}
.rv{opacity:0;transform:translateY(50px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
@media(max-width:800px){.ab,.ct{grid-template-columns:1fr}#bg{display:block}nav ul{position:fixed;inset:0 0 0 30%;background:#0e0e10f5;flex-direction:column;justify-content:center;align-items:center;transform:translateX(100%);transition:.5s}nav ul.o{transform:none}section{padding:80px 6%}}
</style></head><body>
<div id="load"><i></i></div>
<div id="app"></div>
<script src="content.js"></script>
<script>
let C;try{C=JSON.parse(localStorage.getItem('siteContent'))}catch(e){}C=C||DEFAULTS;
const r=document.documentElement.style;for(const k in C.colors)r.setProperty('--'+k,C.colors[k]);
document.title=C.brand.name+' | '+C.brand.tagline;
const im=(s)=>s?`<img src="${s}" alt="">`:`<div class="ph">Image placeholder</div>`;
const B=C.brand,H=C.hero,A=C.about,S=C.services,G=C.gallery,K=C.contact;
document.getElementById('app').innerHTML=`
<nav id="nv"><a href="#home" class="logo">${B.logo?`<img src="${B.logo}" alt="">`:'<b></b>'}${B.name}</a>
<button id="bg">☰</button>
<ul id="mn"><li><a href="#home">Home</a></li><li><a href="#about">About</a></li><li><a href="#services">Services</a></li><li><a href="#gallery">Gallery</a></li><li><a href="#contact">Contact</a></li></ul></nav>
<header class="hero" id="home"><div class="hbg ${H.image?'im':''}" id="hb" ${H.image?`style="background-image:url('${H.image}')"`:''}></div>
<span class="sq" style="width:120px;height:120px;left:8%;top:25%"></span><span class="sq" style="width:70px;height:70px;right:12%;bottom:20%;animation-delay:2s"></span>
<div><p class="eb rv">${H.eyebrow}</p><h1 class="rv">${H.title}</h1><p class="rv">${H.text}</p><a href="#contact" class="btn rv">${H.button}</a></div></header>
<section id="about"><div class="ab"><div class="ib rv">${im(A.image)}</div><div class="rv"><p class="eb">${B.tagline}</p><h2>${A.heading}</h2><p>${A.text}</p></div></div></section>
<div class="stats section" style="padding:80px 8%">${A.stats.map(s=>`<div class="rv"><b data-n="${s.number}">0</b><span>${s.label}</span></div>`).join('')}</div>
<section id="services"><div class="hd rv"><h2>${S.heading}</h2><p>${S.intro}</p></div>
<div class="sv rv">${S.items.map((s,i)=>`<div><em>0${i+1}</em><h3>${s.title}</h3><p>${s.text}</p></div>`).join('')}</div></section>
<section id="gallery"><div class="hd rv"><h2>${G.heading}</h2><p>${G.intro}</p></div>
<div class="gl">${G.items.map(g=>`<figure class="ib rv">${im(g.image)}<figcaption>${g.caption}</figcaption></figure>`).join('')}</div></section>
<section id="contact"><div class="ct"><div class="rv"><h2>${K.heading}</h2><p>${K.text}</p><ul style="margin-top:30px"><li><b>Phone</b>${B.phone}</li><li><b>Email</b>${B.email}</li><li><b>Address</b>${B.address}</li><li><b>Hours</b>${B.hours}</li></ul></div>
<form class="rv" id="fm"><input name="n" placeholder="Your Name" required><input name="e" type="email" placeholder="Your Email" required><input name="p" placeholder="Phone"><textarea name="m" rows="4" placeholder="Tell us about your project"></textarea><button class="btn">${K.button}</button></form></div></section>
<footer><div class="logo" style="justify-content:center">${B.logo?`<img src="${B.logo}" alt="">`:'<b></b>'}${B.name}</div><p>${C.footer.text}</p><small>${C.footer.copyright}</small></footer>
<a class="wa" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" href="https://wa.me/${(B.whatsapp||B.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(B.whatsappMessage||'Hello')}"><svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.3.6 4.4 1.7 6.3L3 29l7.4-1.9c1.8 1 3.7 1.500 5.600 1.500 7 0 12.600-5.600 12.600-12.500S23 3 16 3zm0 22.800c-1.800 0-3.500-.5-5-1.400l-.4-.2-4.400 1.100 1.200-4.300-.3-.4a10 10 0 0 1-1.500-5.200C5.600 10 10.300 5.400 16 5.400s10.400 4.600 10.400 10.200S21.700 25.800 16 25.800zm5.700-7.500c-.3-.2-1.800-.9-2.100-1-.3-.1-.5-.2-.7.200l-1 1.200c-.2.200-.4.200-.7.100-1.800-.9-3-1.600-4.200-3.600-.3-.5.300-.5.900-1.600.1-.2 0-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1.100 1.100-1.100 2.600s1.100 3 1.300 3.200c.2.200 2.200 3.400 5.300 4.700 2 .8 2.700.9 3.700.7.600-.1 1.800-.7 2-1.400.3-.7.300-1.300.2-1.400-.1-.1-.3-.2-.6-.3z"/></svg><span>Chat on WhatsApp</span></a>`;
window.onload=()=>{const l=document.getElementById('load');l.style.opacity=0;l.style.visibility='hidden'};
setTimeout(()=>window.onload(),2500);
const nv=document.getElementById('nv'),hb=document.getElementById('hb'),mn=document.getElementById('mn');
addEventListener('scroll',()=>{nv.classList.toggle('s',scrollY>60);hb.style.transform=`translateY(${scrollY*.25}px)`});
document.getElementById('bg').onclick=()=>mn.classList.toggle('o');mn.onclick=()=>mn.classList.remove('o');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');const b=e.target.querySelector('[data-n]');if(b)cnt(b);io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%4)*.12+'s';io.observe(el)});
function cnt(b){const t=+b.dataset.n;let c=0;const st=Math.max(1,t/60);const id=setInterval(()=>{c+=st;if(c>=t){c=t;clearInterval(id)}b.textContent=Math.floor(c)+'+'},25)}
document.getElementById('fm').onsubmit=e=>{e.preventDefault();const f=e.target;location.href=`mailto:${B.email}?subject=Website Enquiry from ${encodeURIComponent(f.n.value)}&body=${encodeURIComponent(f.m.value+'\n\nPhone: '+f.p.value+'\nEmail: '+f.e.value)}`};
</script></body></html>
